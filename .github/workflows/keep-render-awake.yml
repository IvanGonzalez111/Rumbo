name: Mantener Rumbo activo

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enviar latido a Render
        run: |
          curl --fail --silent --show-error \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            https://rumbo-ivan-gonzalez.onrender.com/api/health
